[package]
name = "diffie"
version = "0.1.0"
edition = "2021"
description = "A code diffing & 3-way merge desktop app"
authors = ["juanval"]

[lib]
name = "diffie_lib"
path = "src/lib.rs"

[[bin]]
name = "diffie"
path = "src/main.rs"

[features]
default = ["gui"]
gui = [
    "dep:imgui",
    "dep:imgui-winit-support",
    "dep:imgui-wgpu",
    "dep:winit",
    "dep:wgpu",
    "dep:pollster",
    "dep:rfd",
    "dep:aetna-fonts-roboto",
    "dep:earcutr",
    "dep:arboard",
    "dep:dirs",
]

[dependencies]
# core (always on)
diff = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
encoding_rs = "0.8"

# gui (gated by `gui` feature)
imgui = { version = "0.12", optional = true }
imgui-winit-support = { version = "0.13", optional = true }
imgui-wgpu = { version = "0.25", optional = true }
winit = { version = "0.30", features = ["x11", "wayland", "wayland-dlopen", "rwh_06"], optional = true }
wgpu = { version = "25", optional = true }
pollster = { version = "0.3", optional = true }
rfd = { version = "0.14", optional = true }
aetna-fonts-roboto = { version = "0.1", optional = true }
earcutr = { version = "0.4", optional = true }
arboard = { version = "3", optional = true }
dirs = { version = "6", optional = true }
