[package]
name = "diffie"
version = "0.1.0"
edition = "2021"
description = "A code diffing & 3-way merge desktop app"
authors = ["juanval"]

[lib]
name = "diffie_lib"
path = "src/lib.rs"

[[bin]]
name = "diffie"
path = "src/main.rs"

[features]
default = ["gui"]
gui = [
    "dep:imgui",
    "dep:imgui-winit-support",
    "dep:imgui-wgpu",
    "dep:winit",
    "dep:wgpu",
    "dep:pollster",
    "dep:rfd",
    "dep:aetna-fonts-roboto",
    "dep:earcutr",
    "dep:arboard",
    "dep:dirs",
    "dep:undo",
    "dep:tree-sitter",
    "dep:tree-sitter-highlight",
    "dep:tree-sitter-cpp",
    "dep:tree-sitter-c-sharp",
    "dep:tree-sitter-hlsl",
    "dep:tree-sitter-rust",
]

[dependencies]
# core (always on)
similar = "2"
imara-diff = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
encoding_rs = "0.8"
merge3 = "0.2"

# gui (gated by `gui` feature)
imgui = { version = "0.12", optional = true }
imgui-winit-support = { version = "0.13", optional = true }
imgui-wgpu = { version = "0.28", optional = true }
winit = { version = "0.30", features = ["x11", "wayland", "wayland-csd-adwaita", "wayland-dlopen", "rwh_06"], optional = true }
wgpu = { version = "29", optional = true }
pollster = { version = "0.4", optional = true }
rfd = { version = "0.17", optional = true }
aetna-fonts-roboto = { version = "0.1", optional = true }
earcutr = { version = "0.5", optional = true }
arboard = { version = "3", optional = true }
dirs = { version = "6", optional = true }
undo = { version = "0.52", optional = true }
tree-sitter = { version = "0.26", optional = true }
tree-sitter-highlight = { version = "0.26", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-c-sharp = { version = "0.23", optional = true }
tree-sitter-hlsl = { version = "0.2", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3.27.0"
