[package]
name = "diffie"
version = "0.1.0"
edition = "2021"
description = "A code diffing & 3-way merge desktop app"
authors = ["juanval"]

[lib]
name = "diffie_lib"
path = "src/lib.rs"

[[bin]]
name = "diffie"
path = "src/main.rs"

[dependencies]
diff = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
encoding_rs = "0.8"
